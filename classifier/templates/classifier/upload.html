{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin AI Upload</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s;
        }

        .upload-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-weight: 700;
            margin-bottom: 30px;
            color: #333;
        }

        .btn-upload {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-upload:hover {
            background: linear-gradient(90deg, #2575fc, #6a11cb);
            transform: scale(1.05);
        }

        .prediction {
            margin-top: 30px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #28a745;
        }

        .uploaded-img {
            margin-top: 20px;
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .uploaded-img:hover {
            transform: scale(1.03);
        }

        .stats {
            margin-top: 20px;
            text-align: left;
            font-size: 0.95rem;
            background: #f7f7f7;
            padding: 15px;
            border-radius: 10px;
        }

        .stats li {
            margin-bottom: 5px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="upload-container">
    <h1>Завантажте зображення</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input class="form-control form-control-lg" type="file" name="image" required>
        <button class="btn btn-upload w-100" type="submit">Відправити</button>
    </form>

    {% if prediction %}
        <div class="prediction">Прогноз: {{ prediction }}</div>
        <img src="{{ image_url }}" alt="Uploaded Image" class="uploaded-img">

        {% if stats_text %}
<div class="prediction">
    {{ prediction }}
</div>
<div class="stats">
    <pre>{{ stats_text }}</pre>
</div>
{% endif %}
    {% endif %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
